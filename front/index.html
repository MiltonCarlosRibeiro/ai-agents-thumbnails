<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SNES Thumbnails</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@300;400;500;700&family=Ubuntu+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="pad" aria-hidden="true">
      <span style="--c: var(--snes-red)"></span>
      <span style="--c: var(--snes-yellow)"></span>
      <span style="--c: var(--snes-green)"></span>
      <span style="--c: var(--snes-blue)"></span>
    </div>
    <h1 id="titulo">SNES Thumbnails</h1>
    <p id="meta" class="muted">Aguardando o run.bat…</p>
  </header>

  <main>
    <section id="grid" class="grid"></section>

    <p id="vazio" class="vazio" hidden></p>

    <section id="escolha" class="card escolha" hidden>
      <img id="escolhida-img" alt="">
      <div class="info">
        <span class="num">Thumbnail escolhida</span>
        <h3>Por que a <span id="escolhida-num"></span>?</h3>
        <p id="justificativa"></p>
      </div>
    </section>

    <section id="roteiro-box" hidden>
      <h2 class="secao">Roteiro</h2>
      <div id="roteiro" class="roteiro-grid"></div>
    </section>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
